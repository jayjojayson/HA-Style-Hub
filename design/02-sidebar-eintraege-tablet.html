<div style="height: 54px; border-radius: 10px; background: #1D2640; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 5px; border: 1.5px solid #A9B4CC"></span><span>Logbuch</span></div>
<div style="height: 54px; border-radius: 10px; background: #1D2640; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px"><span style="width: 16px; height: 16px; box-sizing: border-box; border-radius: 5px; border: 1.5px solid #A9B4CC"></span><span>Verlauf</span></div>

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 12px; font-weight: 600; color: #566070">Spaltenbreite</span><span style="font-size: 12px; color: #2440D0">geändert, vorher 2</span></div>

<button style="height: 56px; border: 1px solid #D3D8DF; border-radius: 10px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 12px; cursor: pointer"><span style="width: 36px; height: 14px; border-radius: 4px; background: #2E9B6E"></span><span>Icon</span></button>

<button style="height: 56px; border: 1px solid #D3D8DF; border-radius: 10px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; font-size: 12px; cursor: pointer"><span style="width: 36px; height: 14px; box-sizing: border-box; border-radius: 4px; border: 1px dashed #8A93A0"></span><span>Hintergrund</span></button>
