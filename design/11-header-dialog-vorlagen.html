<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>HA Style Hub – Bühne, Header-Vorlagen</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
a{color:#2440D0}a:hover{color:#182C99}
button{font:inherit;color:inherit}
</style>
</head>
<body>
<div style="width: 820px; height: 560px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: #9AA1AC; color: #14171C; font-family: 'Schibsted Grotesk', system-ui, sans-serif; font-size: 14px; line-height: 1.45; padding: 40px">
<div role="dialog" aria-modal="true" aria-labelledby="bhp-title" style="width: 100%; box-sizing: border-box; border-radius: 16px; background: #FFFFFF; padding: 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px -20px rgba(20, 23, 28, 0.6)">
<div style="display: flex; align-items: baseline; gap: 10px">
<h2 id="bhp-title" style="margin: 0; font-weight: 800; font-size: 22px; letter-spacing: -0.02em">Vorlagen</h2>
<span style="color: #566070">Header</span>
</div>
<p style="margin: 0; color: #3A424E">Ein fertiges Aussehen mit einem Klick. Die Vorlage füllt die Felder dieser Seite; ob die Leiste ausgeblendet ist, bleibt wie es ist, und gespeichert wird erst mit „Speichern“.</p>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<button aria-pressed="true" style="border: 2px solid #2440D0; border-radius: 12px; background: #FFFFFF; padding: 10px; display: flex; flex-direction: column; gap: 10px; text-align: left; cursor: pointer">
<span style="height: 84px; border-radius: 8px; background: #101A22; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px"><span style="height: 22px; border-radius: 6px; background: rgba(255, 255, 255, 0.16); border: 1px solid rgba(255, 255, 255, 0.24); box-sizing: border-box"></span><span style="flex: 1; border-radius: 6px; background: #1B2A36"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><strong>Glas</strong><span style="font-size: 12px; color: #566070">Durchscheinend mit Weichzeichner</span></span>
</button>
<button style="border: 1px solid #D3D8DF; border-radius: 12px; background: #FFFFFF; padding: 11px; display: flex; flex-direction: column; gap: 10px; text-align: left; cursor: pointer">
<span style="height: 84px; border-radius: 8px; background: #15181C; padding: 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px"><span style="height: 12px; background: #2F3640"></span><span style="flex: 1; border-radius: 6px; background: #20252C"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><strong>Schlank</strong><span style="font-size: 12px; color: #566070">Niedrig, kleine Icons</span></span>
</button>
<button style="border: 1px solid #D3D8DF; border-radius: 12px; background: #FFFFFF; padding: 11px; display: flex; flex-direction: column; gap: 10px; text-align: left; cursor: pointer">
<span style="height: 84px; border-radius: 8px; background: #15181C; padding: 0 10px 10px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px"><span style="height: 26px; border-radius: 0 0 10px 10px; background: #2E6FD9"></span><span style="flex: 1; border-radius: 6px; background: #20252C"></span></span>
<span style="display: flex; flex-direction: column; gap: 2px"><strong>Abgesetzt</strong><span style="font-size: 12px; color: #566070">Farbige Leiste mit runden Ecken unten</span></span>
</button>
</div>
<p style="margin: 0; padding: 10px 12px; border-radius: 9px; background: #F3F5F7; font-size: 13px; color: #3A424E">Die Felder der Kopfzeile mit dieser Vorlage füllen? Was jetzt drinsteht, geht dabei verloren.</p>
<div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px">
<button style="height: 40px; padding: 0 16px; border: 1px solid #B9C0CA; border-radius: 9px; background: transparent; cursor: pointer">Abbrechen</button>
<button style="height: 40px; padding: 0 18px; border: 0; border-radius: 9px; background: #2440D0; color: #FFFFFF; font-weight: 600; cursor: pointer">Vorlage Glas übernehmen</button>
</div>
</div>
</div>
</body>
</html>
